<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
</helmet>
<header style="position:fixed;top:0;left:0;right:0;z-index:60;background:{{ bg }};border-bottom:1px solid {{ line }};transition:background .5s ease, border-color .5s ease;font-family:'Hanken Grotesk',sans-serif;color:#F1E9DC">
  <div style="max-width:1440px;margin:0 auto;padding:{{ pad }} clamp(20px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:24px;transition:padding .5s ease">
    <a href="Home.dc.html" aria-label="Sagrado Fogão, página inicial" style="font-family:'Instrument Serif',serif;font-size:clamp(20px,2vw,25px);letter-spacing:.16em;color:#F1E9DC;text-decoration:none;white-space:nowrap;line-height:1">SAGRADO FOGÃO</a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Principal" style="display:flex;align-items:center;gap:clamp(18px,2.4vw,38px)">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" aria-current="{{ l.current }}" style="color:{{ l.color }};text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:10px 0;border-bottom:1px solid {{ l.border }};transition:color .3s ease" style-hover="color:#F1E9DC">{{ l.label }}</a>
        </sc-for>
      </nav>
      <a href="Reservas.dc.html" style="display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;background:#A54F32;color:#FAF7F1;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;transition:background .3s ease" style-hover="background:#8C4129">Reservar mesa</a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:6px">
        <a href="Reservas.dc.html" style="display:inline-flex;align-items:center;height:44px;padding:0 16px;background:#A54F32;color:#FAF7F1;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">Reservar</a>
        <button type="button" onClick="{{ toggle }}" aria-label="{{ menuLabel }}" aria-expanded="{{ open }}" style="width:44px;height:44px;background:transparent;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px">
          <span style="display:block;width:24px;height:1px;background:#F1E9DC;transition:transform .35s ease;transform:{{ topBar }}"></span>
          <span style="display:block;width:24px;height:1px;background:#F1E9DC;transition:transform .35s ease;transform:{{ botBar }}"></span>
        </button>
      </div>
    </sc-if>
  </div>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Menu" style="position:fixed;inset:0;z-index:55;background:#161411;color:#F1E9DC;font-family:'Hanken Grotesk',sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:110px 24px 32px;overflow-y:auto">
    <nav aria-label="Menu móvel" style="display:flex;flex-direction:column">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="font-family:'Instrument Serif',serif;font-size:42px;line-height:1.15;color:{{ l.mColor }};text-decoration:none;padding:6px 0;border-bottom:1px solid rgba(241,233,220,.12)">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;flex-direction:column;gap:18px;padding-top:40px">
      <div style="font-size:14px;line-height:1.6;color:#BDB1A1">Rua Harmonia, 327 · Vila Madalena<br>Ter–Dom · Almoço &amp; Jantar</div>
      <a href="Reservas.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;background:#A54F32;color:#FAF7F1;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase">Reservar mesa</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;sagrado&quot;,&quot;cardapio&quot;,&quot;experiencia&quot;,&quot;galeria&quot;,&quot;contato&quot;,&quot;reservas&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, open: false, mobile: false };
  componentDidMount() {
    this.onScroll = () => {
      const s = window.scrollY > 40;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
      if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.parallax(); });
    };
    this.onResize = () => {
      const m = window.innerWidth < 980;
      if (m !== this.state.mobile) this.setState({ mobile: m, open: m ? this.state.open : false });
      this.parallax();
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.onResize(); this.onScroll();
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target;
      el.style.opacity = '1'; el.style.transform = 'none'; el.style.clipPath = 'inset(0 0 0 0)';
      this.io.unobserve(el);
    }), { rootMargin: '0px 0px -6% 0px' });
    this.scan = () => {
      document.querySelectorAll('[data-reveal]:not([data-rv])').forEach(el => {
        el.setAttribute('data-rv', '');
        if (el.getBoundingClientRect().top < window.innerHeight * 0.92) return;
        const d = el.getAttribute('data-delay') || 0;
        if (el.getAttribute('data-reveal') === 'img') {
          el.style.clipPath = 'inset(12% 0 0 0)'; el.style.opacity = '0';
          el.style.transition = `clip-path 1.3s ${ease} ${d}ms, opacity .9s ease ${d}ms`;
        } else {
          el.style.opacity = '0'; el.style.transform = 'translateY(26px)';
          el.style.transition = `opacity 1s ${ease} ${d}ms, transform 1s ${ease} ${d}ms`;
        }
        this.io.observe(el);
      });
      this.parallax();
    };
    this.scan();
    this.mo = new MutationObserver(() => this.scan());
    this.mo.observe(document.body, { childList: true, subtree: true });
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a[href$=".dc.html"]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target) return;
      e.preventDefault();
      document.body.style.transition = 'opacity .22s ease';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = a.getAttribute('href'); }, 200);
    };
    document.addEventListener('click', this.onClick);
    this.onShow = e => { if (e.persisted) document.body.style.opacity = '1'; };
    window.addEventListener('pageshow', this.onShow);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    document.removeEventListener('click', this.onClick);
    window.removeEventListener('pageshow', this.onShow);
    this.mo && this.mo.disconnect(); this.io && this.io.disconnect();
    document.body.style.overflow = '';
  }
  parallax() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const h = window.innerHeight;
    document.querySelectorAll('[data-parallax]').forEach(el => {
      const p = el.parentElement.getBoundingClientRect();
      if (p.bottom < -200 || p.top > h + 200) return;
      const k = parseFloat(el.getAttribute('data-parallax')) || 0.12;
      el.style.transform = `translate3d(0,${((p.top + p.height / 2) - h / 2) * -k}px,0)`;
    });
  }
  renderVals() {
    const { scrolled, open, mobile } = this.state;
    const act = this.props.active || 'inicio';
    const items = [['inicio', 'Início', 'Home.dc.html'], ['sagrado', 'O Sagrado', 'OSagrado.dc.html'], ['cardapio', 'Cardápio', 'Cardapio.dc.html'], ['experiencia', 'Experiência', 'Experiencia.dc.html'], ['galeria', 'Galeria', 'Galeria.dc.html'], ['contato', 'Contato', 'Contato.dc.html']];
    const solid = scrolled || open;
    return {
      bg: solid ? 'rgba(22,20,17,.97)' : 'rgba(22,20,17,0)',
      line: solid ? 'rgba(241,233,220,.10)' : 'rgba(241,233,220,0)',
      pad: scrolled ? '14px' : '26px',
      desktop: !mobile, mobile, open,
      menuLabel: open ? 'Fechar menu' : 'Abrir menu',
      topBar: open ? 'translateY(4px) rotate(45deg)' : 'none',
      botBar: open ? 'translateY(-4px) rotate(-45deg)' : 'none',
      toggle: () => { const o = !this.state.open; document.body.style.overflow = o ? 'hidden' : ''; this.setState({ open: o }); },
      links: items.map(([k, label, href]) => ({
        label, href, current: k === act ? 'page' : undefined,
        color: k === act ? '#F1E9DC' : 'rgba(241,233,220,.78)',
        mColor: k === act ? '#C8714F' : '#F1E9DC',
        border: k === act ? '#A54F32' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
