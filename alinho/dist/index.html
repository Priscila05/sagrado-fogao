<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7c6b" />
    <meta
      name="description"
      content="ALINHO — CRM para organizar clientes, acompanhar oportunidades e não esquecer nenhum contato."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ALINHO — Nenhuma oportunidade esquecida</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('alinho.theme');
        var resolved =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        /* localStorage unavailable: keep the light default */
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CMLDoW57.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B5JZKSfS.css">
  </head>

  </body>
</html>
