<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" width="320" height="470" role="img" aria-label="Copo de açaí com banana, granola e calda">
  <defs>
    <clipPath id="copo"><path d="M72 168 L96 404 Q99 428 123 428 L197 428 Q221 428 224 404 L248 168 Z"/></clipPath>
    <linearGradient id="acai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B1A7E"/><stop offset="1" stop-color="#330B48"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".16"/>
    </linearGradient>
  </defs>

  <!-- monte de açaí e frutas acima da borda -->
  <path d="M86 176 Q92 112 160 104 Q228 112 234 176 Z" fill="#4A1264"/>
  <path d="M104 150 Q126 120 160 118 Q150 136 138 152 Z" fill="#6B2192" opacity=".75"/>
  <!-- calda escorrendo -->
  <path d="M96 168 Q104 148 118 150 Q134 152 150 142 Q170 131 192 140 Q212 148 226 170 L226 176 L96 176 Z" fill="#2A0636" opacity=".55"/>
  <!-- granola -->
  <g fill="#D8A657">
    <circle cx="112" cy="160" r="7"/><circle cx="130" cy="148" r="6"/><circle cx="150" cy="158" r="7"/>
    <circle cx="176" cy="150" r="6"/><circle cx="196" cy="160" r="7"/><circle cx="214" cy="152" r="6"/>
  </g>
  <g fill="#B9803A">
    <circle cx="121" cy="166" r="4"/><circle cx="163" cy="149" r="4"/><circle cx="205" cy="146" r="4"/>
  </g>
  <!-- rodelas de banana -->
  <g>
    <circle cx="133" cy="128" r="22" fill="#FFD95E"/><circle cx="133" cy="128" r="14" fill="#F7C93F"/><circle cx="133" cy="128" r="4" fill="#E0AE28"/>
    <circle cx="186" cy="120" r="19" fill="#FFD95E"/><circle cx="186" cy="120" r="12" fill="#F7C93F"/><circle cx="186" cy="120" r="3.5" fill="#E0AE28"/>
    <circle cx="210" cy="146" r="16" fill="#FFE07F"/><circle cx="210" cy="146" r="10" fill="#F7C93F"/>
  </g>
  <!-- morango -->
  <path d="M160 92 Q178 92 178 110 Q178 130 160 142 Q142 130 142 110 Q142 92 160 92 Z" fill="#E5325B"/>
  <path d="M150 96 Q160 86 170 96 Q160 100 150 96 Z" fill="#49A845"/>
  <g fill="#FFD3DE" opacity=".8"><circle cx="155" cy="108" r="2"/><circle cx="166" cy="114" r="2"/><circle cx="159" cy="124" r="2"/></g>

  <!-- camadas dentro do copo -->
  <g clip-path="url(#copo)">
    <rect x="60" y="160" width="200" height="280" fill="url(#acai)"/>
    <rect x="60" y="238" width="200" height="34" fill="#FFF3D9"/>
    <rect x="60" y="272" width="200" height="22" fill="#D8A657"/>
    <rect x="60" y="330" width="200" height="30" fill="#FFF3D9" opacity=".92"/>
    <g fill="#E5325B"><circle cx="105" cy="312" r="9"/><circle cx="150" cy="320" r="7"/><circle cx="205" cy="308" r="8"/></g>
    <rect x="60" y="160" width="200" height="280" fill="url(#brilho)"/>
  </g>

  <!-- copo -->
  <path d="M72 168 L96 404 Q99 428 123 428 L197 428 Q221 428 224 404 L248 168 Z" fill="none" stroke="#FFFDF8" stroke-opacity=".75" stroke-width="5"/>
  <ellipse cx="160" cy="168" rx="88" ry="21" fill="none" stroke="#FFFDF8" stroke-opacity=".9" stroke-width="6"/>
  <path d="M108 200 L124 392" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
  <!-- colher -->
  <path d="M258 132 q22 10 16 34 q-6 22 -26 16 q-18 -6 -12 -26 q5 -18 22 -24 Z" fill="#FFC627"/>
  <rect x="252" y="176" width="12" height="150" rx="6" transform="rotate(10 258 176)" fill="#FFC627"/>
</svg>
